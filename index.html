<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Dash - Hand Controlled Game</title>
<style>
body{margin:0;background:#0f172a;color:white;font-family:Arial;text-align:center;overflow:hidden}
h1{margin:8px 0 2px;font-size:22px}
p{margin:2px;color:#94a3b8;font-size:13px}
#wrap{position:relative;width:100%;max-width:640px;margin:auto}
video{width:100%;border-radius:12px;transform:scaleX(-1)}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#game{width:100%;max-width:640px;height:220px;background:#020617;margin:10px auto;border-radius:12px;position:relative;overflow:hidden;border:2px solid #38bdf8}
#player{position:absolute;left:50px;bottom:20px;width:40px;height:40px;background:#facc15;border-radius:50%;font-size:28px;line-height:40px;transition:bottom .1s}
#obs{position:absolute;right:-40px;bottom:20px;width:30px;height:40px;background:#ef4444;border-radius:6px}
#dot{position:absolute;width:18px;height:18px;background:#22c55e;border-radius:50%;display:none}
button{background:#22c55e;color:white;border:none;padding:12px 24px;border-radius:20px;font-size:16px;font-weight:bold;margin:8px}
#score{font-size:18px;font-weight:bold}
</style>
</head>
<body>
<h1>✋ HAND DASH</h1>
<p>Open palm = JUMP | Fist = DOWN | Move hand to collect green dots</p>
<div id="wrap">
<video id="video" autoplay playsinline muted></video>
<canvas id="overlay"></canvas>
</div>
<div id="score">Score: 0 | Best: 0</div>
<button onclick="startGame()">▶ START GAME</button>
<div id="game">
<div id="player">😀</div>
<div id="obs"></div>
<div id="dot">●</div>
</div>
<p id="status">Click START, allow camera, show your hand</p>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>
let video=document.getElementById('video');
let canvas=document.getElementById('overlay');
let ctx=canvas.getContext('2d');
let player=document.getElementById('player');
let obs=document.getElementById('obs');
let dot=document.getElementById('dot');
let scoreEl=document.getElementById('score');
let statusEl=document.getElementById('status');
let score=0,best=0,playing=false,playerY=20,isJumping=false,obsX=-40,dotX=0,dotY=0,lastJump=0;

function startGame(){
  playing=true; score=0; obsX=600; spawnDot();
  scoreEl.innerText="Score: 0 | Best: "+best;
  statusEl.innerText="Playing... Open palm to JUMP!";
  let hands=new Hands({locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
  hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:0.5,minTrackingConfidence:0.5});
  hands.onResults(onResults);
  let cam=new Camera(video,{onFrame:async()=>{await hands.send({image:video})},width:640,height:480});
  cam.start();
}
function spawnDot(){
  dotX=Math.random()*500+80;
  dotY=Math.random()*120+20;
  dot.style.left=dotX+'px';
  dot.style.top=dotY+'px';
  dot.style.display='block';
}
function onResults(res){
  canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save(); ctx.scale(-1,1); ctx.translate(-canvas.width,0);
  ctx.drawImage(res.image,0,0,canvas.width,canvas.height);
  if(res.multiHandLandmarks && res.multiHandLandmarks.length>0){
    let lm=res.multiHandLandmarks[0];
    // Draw dots on hand
    for(let p of lm){
      ctx.beginPath(); ctx.arc(p.x*canvas.width,p.y*canvas.height,6,0,2*Math.PI);
      ctx.fillStyle='#22c55e'; ctx.fill();
      ctx.strokeStyle='white'; ctx.lineWidth=2; ctx.stroke();
    }
    // Palm open check: fingers extended
    let open = lm[8].y < lm[6].y && lm[12].y < lm[10].y;
    let handX = lm[9].x*640;
    // Move player with hand X
    if(playing){
      let px = 500 - handX;
      if(px<10) px=10; if(px>550) px=550;
      player.style.left=px+'px';
      // Jump on open palm
      if(open && Date.now()-lastJump>600){
        lastJump=Date.now();
        jump();
      }
      // Check dot collect - if player near dot
      let pLeft=parseInt(player.style.left||50);
      if(Math.abs(pLeft-dotX)<40 && Math.abs(playerY-dotY)<60){
        score+=10; spawnDot();
        scoreEl.innerText="Score: "+score+" | Best: "+best;
      }
    }
    statusEl.innerText = open ? "✋ OPEN PALM - JUMP!" : "✊ FIST - RUN";
  }
}
function jump(){
  if(isJumping) return; isJumping=true;
  let h=20; let up=setInterval(()=>{
    h+=12; playerY=h; player.style.bottom=h+'px';
    if(h>=130){clearInterval(up);
      let down=setInterval(()=>{h-=12; playerY=h; player.style.bottom=h+'px'; if(h<=20){clearInterval(down); isJumping=false;}},20);
    }
  },20);
}
setInterval(()=>{
  if(!playing) return;
  obsX-=6; if(obsX<-40){obsX=640;}
  obs.style.right=(640-obsX)+'px';
  // Collision
  let pLeft=parseInt(player.style.left||50);
  if(obsX>pLeft && obsX<pLeft+40 && playerY<60){
    playing=false; if(score>best) best=score;
    statusEl.innerText="💥 GAME OVER! Score: "+score+" - Click START again";
    scoreEl.innerText="Score: "+score+" | Best: "+best;
  }
},30);
</script>
</body>
</html>
